<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sound Garden paper-cut direction</title>
<!-- lazy-after-first-sprout: in the app this single link is injected after S6, until then the system stack renders headings. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700&display=swap">
<style>:root{--leaf:#4CB82B;--edge:#2F7D32;--ink:#12330F;--sun:#FFC21A;--sky:#2FA8F2;--cream:#FBF6EA;--right:#0F766E;--wrong:#A84A07;--text:#2B2A26;--card:#FFFDF6;--paper:#E6DABB;--soil:#7A4B1E}
*{box-sizing:border-box;margin:0}
body{background:#CFC3A3;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
.disp{font-family:'Grandstander','Trebuchet MS',system-ui,sans-serif;font-weight:700}
.board{display:flex;gap:40px;padding:36px;width:max-content}
figure{display:flex;flex-direction:column;gap:14px}
figcaption{font:700 15px/1 system-ui,sans-serif;color:var(--ink);letter-spacing:.04em;text-transform:uppercase}
.phone{position:relative;width:390px;height:844px;overflow:hidden;border-radius:34px;box-shadow:0 10px 0 rgba(18,51,15,.28)}
.fill{position:absolute;inset:0;width:100%;height:100%}
.up{filter:drop-shadow(0 -5px 0 rgba(18,51,15,.24))}
.shadow-s{filter:drop-shadow(0 5px 0 rgba(18,51,15,.3))}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.sprig{overflow:visible;display:block}
.sp-body{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite}
.sp-leaf-in{transform-box:view-box;transform-origin:60px 22px;animation:sway 3.4s ease-in-out infinite}
.sp-eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.6s infinite}
.lesson .sp-body{animation-duration:5s}
.lesson .sp-eyes{animation:none}
.tuck .sp-body{animation:none}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.rays,.rays6{animation:spin 90s linear infinite}
.rays6{animation-duration:140s}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud-in{animation:drift 46s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(60px)}}
.ring{transform-origin:0 0;animation:ringp 2.4s ease-out infinite}
.ring.r2{animation-delay:1.2s}
@keyframes ringp{0%{transform:scale(.92);opacity:.95}100%{transform:scale(1.28);opacity:0}}
.seed-main{transform-origin:0 70px;animation:seedb 2.4s ease-in-out infinite}
@keyframes seedb{0%,100%{transform:scale(1)}50%{transform:scale(1.03,.98)}}
.ready{transform-box:fill-box;transform-origin:center;animation:glow 2.2s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.25}50%{opacity:1}}
.drop{animation:fall 2.4s cubic-bezier(.5,0,.9,.6) infinite}
@keyframes fall{0%{transform:translateY(-26px);opacity:0}15%{opacity:1}70%{transform:translateY(62px);opacity:1}78%,100%{transform:translateY(70px);opacity:0}}
.pop{animation:sprout .9s cubic-bezier(.35,1.8,.35,.83) .25s both}
.tagpop{animation:sprout .5s cubic-bezier(.35,1.8,.35,.83) 1.1s both}
@keyframes sprout{0%{transform:scale(0)}100%{transform:scale(1)}}
.fbtint{animation:fadein .15s both}
@keyframes fadein{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.ring{opacity:.5}.drop{opacity:1;transform:translateY(30px)}}

/* S1 */
.title{position:absolute;left:26px;top:58px;font-size:50px;line-height:.98;color:var(--cream);text-shadow:0 5px 0 var(--ink);letter-spacing:.01em}
.sign{position:absolute;left:30px;top:372px;transform:rotate(-3deg)}
.seedbtn{position:absolute;left:80px;top:420px;width:230px;height:230px;border-radius:50%}
.tiles{position:absolute;left:26px;right:26px;top:630px;display:flex;gap:14px}
.tiles div{width:54px;height:62px;border-radius:14px;background:var(--cream);border:3px solid var(--ink);box-shadow:0 5px 0 rgba(18,51,15,.35);display:grid;place-items:center;font:700 36px 'Grandstander','Trebuchet MS',sans-serif;color:var(--ink);transform:rotate(var(--r))}
.s1foot{position:absolute;left:0;right:0;bottom:0;height:112px;background:var(--cream);padding:18px 26px 0;box-shadow:0 -5px 0 rgba(18,51,15,.3);display:flex;flex-direction:column;align-items:center;gap:4px}
.s1foot p{font-size:15px;font-weight:700;color:var(--ink)}
.s1foot a{display:flex;align-items:center;min-height:48px;font-size:17px;font-weight:700;color:#2A7230;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}

/* hero button */
.hero{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:68px;border-radius:22px;background:var(--leaf);color:var(--ink);font-size:28px;border:4px solid var(--edge);border-bottom-width:9px}
.hero:active{transform:translateY(4px);border-bottom-width:5px}
.hero.retry{background:var(--cream);border-color:var(--sky);color:var(--ink)}
.foot{position:absolute;left:16px;right:16px;bottom:62px}

/* lesson */
.lesson{background:var(--cream)}
.lhead{position:absolute;left:0;right:0;top:0;height:78px;background:var(--sky);display:flex;align-items:center;gap:14px;padding:6px 16px 0;box-shadow:0 5px 0 rgba(18,51,15,.25)}
.hbtn{width:48px;height:48px;border-radius:50%;background:var(--cream);display:grid;place-items:center;border:3px solid var(--ink);flex:none}
.bar{flex:1;height:16px;border-radius:9px;background:rgba(251,246,234,.55);border:3px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--leaf);transform-origin:left;border-radius:0 8px 8px 0}
.prompt{position:absolute;left:16px;right:16px;top:104px;display:flex;align-items:center;gap:16px}
.snd{width:72px;height:72px;border-radius:50%;background:var(--ink);display:grid;place-items:center;flex:none;box-shadow:0 5px 0 rgba(18,51,15,.3)}
.prompt h2{font-size:28px;line-height:1.1;color:var(--ink)}
.prompt i{font-style:normal;text-decoration:underline 4px var(--leaf);text-underline-offset:6px}
.fb{position:absolute;left:16px;right:16px;top:196px;height:232px;border-radius:28px;background:#F4EBD2;overflow:hidden}
.fb .ground{position:absolute;left:0;bottom:0;width:100%;height:90px}
.tint-right,.tint-wrong{position:absolute;inset:0;z-index:3;pointer-events:none;animation:fadein .15s both}
.tint-right{background:var(--right);opacity:.14}
.tint-wrong{background:var(--wrong);opacity:.14}
.spr{position:absolute;left:6px;bottom:8px;z-index:2}
.speech{position:absolute;left:146px;right:12px;top:16px;z-index:2;background:var(--card);border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 5px 0 rgba(18,51,15,.22)}
.speech p{font-size:21px;line-height:1.1;color:var(--ink)}
.speech u{text-decoration:underline 4px var(--leaf);text-underline-offset:4px}
.patch{position:absolute;right:8px;bottom:4px;z-index:2}
.wrongsp p{font-size:20px}
.example{position:absolute;right:30px;bottom:18px;z-index:2;width:69px;height:69px;border-radius:16px;background:var(--card);box-shadow:0 5px 0 rgba(18,51,15,.28);display:grid;place-items:center;transform:rotate(3deg)}
.example .L{font:700 50px/1 'Grandstander','Trebuchet MS',sans-serif;color:var(--text)}
.exnote{position:absolute;right:20px;top:118px;z-index:2;font-size:18px;color:var(--ink);background:var(--cream);border-radius:12px;padding:5px 12px}
.grid{position:absolute;left:16px;right:16px;top:446px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tile{position:relative;height:124px;border-radius:26px;background:var(--card);box-shadow:0 6px 0 #DCCFAE;display:grid;place-items:center}
.L{font:700 76px/1 'Grandstander','Trebuchet MS',sans-serif;color:var(--text);position:relative}
.L.tgt::after{content:"";position:absolute;left:-2px;right:-2px;bottom:-8px;height:5px;border-radius:3px;background:var(--leaf)}
.tile.right{border:5px solid var(--right);box-shadow:0 2px 0 #DCCFAE;transform:translateY(4px)}
.tile.wrong{border:5px solid var(--wrong);box-shadow:0 2px 0 #DCCFAE;transform:translateY(4px)}
.lesson.right .tile:not(.right){opacity:.55}
.lesson.wrong .tile:not(.wrong){opacity:.9}
.badge{position:absolute;right:-10px;top:-14px}
.lesson .foot{bottom:60px}

/* S6 */
.s6t{position:absolute;left:0;right:0;top:78px;text-align:center;font-size:44px;line-height:1.02;color:var(--ink)}
.s6f{bottom:56px}

/* S3 */
.chips{position:absolute;left:16px;top:24px;display:flex;flex-direction:column;gap:12px}
.chip{display:flex;align-items:center;gap:8px;background:var(--cream);border:3px solid var(--ink);border-radius:20px;padding:8px 16px 8px 10px;box-shadow:0 5px 0 rgba(18,51,15,.3);font-size:19px;color:var(--ink);width:max-content}
.zones{display:flex;gap:6px;padding-left:6px}
.zones i{width:20px;height:10px;border-radius:5px;background:rgba(251,246,234,.5);border:2px solid var(--ink)}
.zones i.on{background:var(--sun)}
.s3spr{position:absolute;left:250px;top:616px;transform:rotate(-2deg)}
.note{position:absolute;left:24px;top:644px;width:196px;background:var(--cream);border:3px solid var(--ink);border-radius:16px;padding:8px 12px;font-size:18px;line-height:1.1;color:var(--ink);transform:rotate(-2deg);box-shadow:0 5px 0 rgba(18,51,15,.3)}
.s3f{bottom:44px}
</style></head><body>
