<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sound Garden, Direction A: Living Garden</title>
<!-- Heading face. LAZY-AFTER-FIRST-SPROUT: the shipped app has NO web font on first load (plan sec. 2). It injects this one link when the first sprout is earned. S1 and S4 below use the system stack only. -->
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;800&display=swap" rel="stylesheet">
<style>:root{--hero:#4CB82B;--edge:#2F7D32;--ink:#12330F;--sun:#FFC21A;--sky:#2FA8F2;--cream:#FBF6EA;--card:#FFFDF6;--right:#0F766E;--wrong:#A84A07;--text:#2B2A26;--leaf-text:#2A7230;--line:#E6DCC2;
 --sys:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
 /* LAZY after first sprout: the app injects the Google Fonts <link> only then. Headings fall back to --sys until it loads. */
 --disp:"Grandstander",var(--sys);}
*{box-sizing:border-box;margin:0}
body{background:#1E2B1A;color:var(--text);font-family:var(--sys);padding:40px 28px 56px;min-width:min-content}
h1.deck{font:700 13px/1 var(--sys);letter-spacing:.14em;text-transform:uppercase;color:#B9D6A8;margin:0 0 6px}
p.deck{font:14px/1.4 var(--sys);color:#8FA784;margin-bottom:26px}
.row{display:flex;gap:28px;align-items:flex-start}
figure{flex:none}
figcaption{font:600 12px/1.3 var(--sys);color:#B9D6A8;margin-top:12px;letter-spacing:.04em}
.phone{position:relative;width:390px;height:844px;overflow:hidden;border-radius:38px;background:var(--cream);isolation:isolate}
.phone>svg.scene,.phone>.bg{position:absolute;inset:0}
.grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.35;z-index:50}
.abs{position:absolute}
.disp{font-family:var(--disp);font-weight:800;letter-spacing:-.01em}
/* hero button: forward moves only */
.hero{display:flex;align-items:center;justify-content:center;gap:12px;height:62px;border:3px solid var(--edge);border-bottom-width:7px;background:var(--hero);color:var(--ink);font:800 19px/1 var(--sys);letter-spacing:.02em;border-radius:22px 26px 22px 28px / 26px 22px 28px 22px;box-shadow:inset 0 3px 0 rgba(255,255,255,.28)}
.hero svg{width:26px;height:26px}
.ghost{display:flex;align-items:center;justify-content:center;height:60px;border:3px solid var(--sky);border-bottom-width:6px;background:var(--card);color:#0B5A8A;font:800 18px/1 var(--sys);border-radius:24px 20px 26px 20px / 22px 26px 20px 24px}
/* ---- motion: transform and opacity only ---- */
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.6s ease-in-out infinite}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4.2s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 5.2s infinite}
.cloud{animation:drift 28s ease-in-out infinite alternate}
.ring{transform-box:fill-box;transform-origin:50% 50%;animation:ring 2.4s ease-in-out infinite}
.ring.b{animation-delay:.8s}
.waves path{animation:wave 2.4s ease-in-out infinite}
.waves path:nth-child(2){animation-delay:.3s}
.drop{animation:drop 2.8s cubic-bezier(.5,0,.8,.5) infinite}
.glow{animation:glow 2.6s ease-in-out infinite}
.glow+*{}
.rise{transform-box:fill-box;transform-origin:50% 100%;animation:rise 1.1s cubic-bezier(.35,1.8,.35,.83) both}
.popin{transform-box:fill-box;transform-origin:50% 100%;animation:pop .2s cubic-bezier(.35,1.8,.35,.83) both}
.rays{transform-origin:195px 360px;animation:spin 60s linear infinite}
.petal{animation:fall 7s linear infinite}
.petal:nth-child(2){animation-delay:-1.6s}.petal:nth-child(3){animation-delay:-3.1s}.petal:nth-child(4){animation-delay:-4.4s}.petal:nth-child(5){animation-delay:-5.6s}.petal:nth-child(6){animation-delay:-2.3s}
.nod{animation:nod .6s cubic-bezier(.35,1.8,.35,.83) both}
.tint{animation:fadein .15s ease both}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.968)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4.5deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(70px)}}
@keyframes ring{0%,100%{opacity:.15;transform:scale(.94)}50%{opacity:.8;transform:scale(1.08)}}
@keyframes wave{0%,100%{opacity:.1}50%{opacity:.8}}
@keyframes drop{0%{transform:translateY(-22px);opacity:0}15%{opacity:1}62%{transform:translateY(8px);opacity:1}72%{transform:translateY(10px) scale(1.6,.4);opacity:0}100%{opacity:0}}
@keyframes glow{0%,100%{opacity:.2}50%{opacity:.75}}
@keyframes rise{from{transform:translateY(60px) scale(.55);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fall{0%{transform:translate(0,-30px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate(26px,760px) rotate(300deg);opacity:.9}}
@keyframes nod{0%{transform:translateY(0)}35%{transform:translateY(6px)}100%{transform:translateY(0)}}
@keyframes fadein{from{opacity:0}to{opacity:var(--o)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.blink{transform:scaleY(0)}}
