name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: npm run build
      - run: node tools/size_budget.mjs
      - run: python3 tools/check_decodable.py
      - run: python3 tools/check_finch.py
      - run: python3 tools/so-compat/tools/check_ph_keys.py
      - run: python3 tools/so-compat/tools/check_practice_links.py
      - run: npx vitest run
